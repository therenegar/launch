; Launch! custom color schemes
; Add shareable schemes using [Name] sections. Values are DOS color numbers 0-15.
; Background fields (BACKGROUND, TITLEBAR_BG, SELECTED_BG, CONTROLS_BG) must be 0-7.
;
; Example:
; [My Scheme]
; BACKGROUND=1
; BORDER=11
; TITLEBAR_FG=15
; TITLEBAR_BG=7
; MAIN_TITLE=12
; TITLES=14
; FOLDERS=15
; LAUNCHERS=10
; SELECTED_FG=15
; SELECTED_BG=3
; CONTROLS_FG=0
; CONTROLS_BG=7
; LABELS=7
